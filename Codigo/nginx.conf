# Ascend Digital — SPA estática (Vite build) servida pelo Nginx.
# TLS é terminado pelo proxy do EasyPanel; aqui escutamos HTTP na 80.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ---- Compressão ----
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml+rss
    application/atom+xml application/manifest+json
    image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

  # ---- Assets com hash: cache longo e imutável ----
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # ---- HTML (index + páginas estáticas): sem cache agressivo ----
  location ~* \.html$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri /index.html;
  }

  # ---- Imagens/fontes de public/: cache médio ----
  location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf|eot)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  # ---- SPA fallback (React Router, ex.: /admin) ----
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }

  # Não vaza dotfiles
  location ~ /\.(?!well-known) {
    deny all;
  }
}
